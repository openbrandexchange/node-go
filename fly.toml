# Fly.io: fly launch --copy-config --name <your-portal>   (see docs/hosting/fly.md)
app = "brand-portal"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  OBX_DATA_DIR = "/data"
  OBX_TRUST_PROXY = "true"

[[mounts]]
  source = "obx_data"
  destination = "/data"
  initial_size = "10gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
