# Release: runs only when a maintainer pushes a version tag (vX.Y.Z).
#   - GoReleaser: node-go for Linux, macOS and Windows (amd64, arm64), with
#     checksums.txt, an SBOM per archive and the dependency licences, as a
#     draft GitHub release whose notes are the CHANGELOG.md entry;
#   - Docker: ghcr.io/openbrandexchange/node-go:<version>, :<major>.<minor>
#     and :latest for linux/amd64 and linux/arm64, with SBOM and provenance
#     attestations.
# Nothing is published by pushing to main. See docs/development.md#releases.
name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0.24.2
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no entry for $v" >&2; exit 1; }
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/openbrandexchange/node-go
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/openbrandexchange/node-go
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
