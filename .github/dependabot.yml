version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/conformance"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      playwright:
        patterns: ["@playwright/*", "@axe-core/*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
